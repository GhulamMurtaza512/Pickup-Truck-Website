<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Pickup Truck & Delivery Services</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            background: #f4f6f8;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 15px;
        }


        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-card {

            width: 100%;

            max-width: 900px;

            background: #ffffff;

            border-radius: 16px;

            padding: 45px 60px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.10);
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .login-title {

            font-size: 32px;

            font-weight: 700;

            margin-bottom: 5px;
        }


        .login-subtitle {

            color: #777;

            margin-bottom: 35px;
        }


        /* =====================================================
           LABEL
        ===================================================== */

        .form-label {

            font-weight: 600;

            margin-bottom: 8px;
        }


        /* =====================================================
           INPUT
        ===================================================== */

        .form-control {

            height: 50px;

            border-radius: 8px;

            border: 1px solid #ddd;

            font-size: 15px;
        }


        .form-control:focus {

            box-shadow: none;

            border-color: #0d6efd;
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-btn {

            height: 50px;

            border-radius: 8px;

            font-size: 17px;

            font-weight: 600;
        }


        /* =====================================================
           LINKS
        ===================================================== */

        .bottom-links {

            text-align: center;

            margin-top: 25px;
        }


        .bottom-links a {

            text-decoration: none;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 768px) {

            body {

                align-items: flex-start;

                padding-top: 30px;
            }

            .login-card {

                padding: 30px 20px;
            }

        }

    </style>

</head>


<body>


<div class="login-card">


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <div class="text-center">

        <h2 class="login-title">
            Welcome Back
        </h2>

        <p class="login-subtitle">
            Login to your account
        </p>

    </div>



    <!-- =====================================================
         LOGIN FORM
    ===================================================== -->

    <form method="POST">

        {% csrf_token %}


        <div class="row g-4">


            <!-- Username -->

            <div class="col-md-6">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                >

            </div>



            <!-- Password -->

            <div class="col-md-6">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                >

            </div>


        </div>



        <!-- =====================================================
             REMEMBER ME
        ===================================================== -->

        <div class="mt-4">

            <div class="form-check">

                <input
                    type="checkbox"
                    name="remember"
                    class="form-check-input"
                    id="remember"
                >

                <label
                    class="form-check-label"
                    for="remember"
                >
                    Remember me
                </label>

            </div>

        </div>



        <!-- =====================================================
             LOGIN BUTTON
        ===================================================== -->

        <div class="mt-4">

            <button
                type="submit"
                class="btn btn-primary w-100 login-btn"
            >
                Login
            </button>

        </div>


    </form>



    <!-- =====================================================
         LINKS
    ===================================================== -->

    <div class="bottom-links">

        <p class="mb-2">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create Account
            </a>

        </p>


        <a href="{% url 'home' %}">
            ← Back to Home
        </a>

    </div>


</div>


</body>

</html>
