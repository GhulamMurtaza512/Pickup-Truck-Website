<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Pickup Truck & Delivery Services</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f6f8;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 15px;
        }


        /* Main Register Card */

        .register-card {

            width: 100%;
            max-width: 900px;

            background: #ffffff;

            border-radius: 16px;

            padding: 30px 40px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.10);
        }


        /* Heading */

        .register-title {

            font-size: 30px;
            font-weight: 700;

            margin-bottom: 5px;
        }


        .register-subtitle {

            color: #777;
            margin-bottom: 25px;
        }


        /* Labels */

        .form-label {

            font-weight: 600;
            margin-bottom: 6px;
        }


        /* Inputs */

        .form-control {

            height: 45px;

            border-radius: 8px;

            border: 1px solid #ddd;
        }


        .form-control:focus {

            box-shadow: none;

            border-color: #0d6efd;
        }


        /* Register Button */

        .register-btn {

            height: 46px;

            border-radius: 8px;

            font-weight: 600;

            font-size: 16px;
        }


        /* Bottom Links */

        .bottom-links {

            text-align: center;

            margin-top: 18px;
        }


        .bottom-links a {

            text-decoration: none;
        }


        /* Mobile */

        @media (max-width: 768px) {

            body {
                align-items: flex-start;
                padding-top: 30px;
            }

            .register-card {

                padding: 25px 20px;

            }

        }

    </style>

</head>


<body>


<div class="register-card">


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <div class="text-center">

        <h2 class="register-title">
            Create Account
        </h2>

        <p class="register-subtitle">
            Register your account to continue
        </p>

    </div>



    <!-- =====================================================
         REGISTER FORM
    ===================================================== -->

    <form method="POST">

        {% csrf_token %}


        <div class="row g-3">


            <!-- First Name -->

            <div class="col-md-6">

                <label class="form-label">
                    First Name
                </label>

                <input
                    type="text"
                    name="first_name"
                    class="form-control"
                    placeholder="Enter first name"
                    required
                >

            </div>



            <!-- Last Name -->

            <div class="col-md-6">

                <label class="form-label">
                    Last Name
                </label>

                <input
                    type="text"
                    name="last_name"
                    class="form-control"
                    placeholder="Enter last name"
                >

            </div>



            <!-- Username -->

            <div class="col-md-6">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Choose username"
                    required
                >

            </div>



            <!-- Email -->

            <div class="col-md-6">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter email"
                    required
                >

            </div>



            <!-- Password -->

            <div class="col-md-6">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Create password"
                    required
                >

            </div>



            <!-- Confirm Password -->

            <div class="col-md-6">

                <label class="form-label">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm password"
                    required
                >

            </div>


        </div>



        <!-- =====================================================
             REGISTER BUTTON
        ===================================================== -->

        <div class="mt-4">

            <button
                type="submit"
                class="btn btn-primary w-100 register-btn"
            >
                Register
            </button>

        </div>


    </form>



    <!-- =====================================================
         LOGIN LINK
    ===================================================== -->

    <div class="bottom-links">

        <span>
            Already have an account?
        </span>

        <a href="{% url 'login' %}">
            Login
        </a>

        <span class="mx-2">
            |
        </span>

        <a href="{% url 'home' %}">
            Back to Home
        </a>

    </div>


</div>


</body>

</html>
